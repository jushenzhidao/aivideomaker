# aivideomaker ark 兼容层 —— compose 部署
#
#   cp .env.example .env      # 填 AVM_COOKIE（.env 已被 gitignore）
#   docker compose up -d      # 拉 GHCR 上的镜像
#   docker compose up -d --build   # 或从当前源码本地构建
#   docker compose logs -f
#   curl -s localhost:8808/healthz | python3 -m json.tool
#
# 部署口径（2026-09-14 定）：**Linux 服务器 = 生产一等公民**，本文件开箱即用
# （minter 必须跑在 Linux 原生 Docker 的 host 网络下，见 minter 段注释）；
# macOS 只是开发机 —— Docker Desktop 的 host 网络仍经 VPNkit NAT，minter 在 Mac 上
# 请宿主直跑并把 AVM_MINTER_URL 指过去（容器内铸造实测不可行）。
#
# 本文件起**三个**服务（默认全起）：
#   ark-compat       —— 协议适配层（对外 8808）
#   minter-preflight —— minter 的部署前置校验（**一次性容器**，跑完即退；见该段注释）
#   minter           —— Turnstile token 铸造服务（Xvfb 有头 Chrome，**不对外映射端口**）
#     docker compose up -d ark-compat      # 只要适配层、不要铸造时这样起（少一份常驻 Chrome）
#
# 🔴 **铸造能力默认开启**（2026-09-14 定）：闸门开启时没 token 的提交吞吐约 20 条/小时，
# 有铸造约 120 条/小时 —— 生产默认需要它，所以 minter 默认随 `up -d` 起。为此 ark-compat 侧的
# `AVM_MINTER_URL` 用 `:-` 插值：.env 里**留空与未设同义**，回退到
# http://host.docker.internal:8899（minter 走 host 网络 ⇒ 就监听在宿主 8899，故"Linux
# 容器化"与"Mac 宿主直跑"两种情形都适用，详见 minter 段注释）。
# 🔓 **铸造服务默认开放：不需要 `AVM_MINTER_KEY`**（2026-09-14 用户口径）。
# 代价必须知道：minter 走 host 网络 ⇒ 8899 就是**宿主端口**，无凭据即"谁连得上谁就能领
# token"（等于把过闸能力分发出去，也会让账号更快撞风控）。敞开不等于必须挂公网 —— 两条收口路：
#   ① 限绑定地址：`AVM_MINTER_BIND_HOST=127.0.0.1`（需 ark-compat 也走 host 网络）或内网地址；
#   ② 配 key 并关掉开放模式：`AVM_MINTER_KEY=<随机串>` + `AVM_MINTER_ALLOW_INSECURE=0`
#      —— 此时前置校验恢复"缺 key 就让 `up` 直接失败"（fail-closed 机制仍在，只是默认不启用）。
#
# 变量从同目录 .env 读取（compose 自动做插值）。这里**逐个显式列出**而不是用
# env_file：env_file 会把 .env 里所有变量（含无关项）一股脑灌进容器，而显式列举
# 写错名字会立刻暴露成空值，符合本项目"宁可报错不要静默"的口径。
#
# **九个** compose 专属变量（**故意不写进 .env.example** —— 那里只放代码实际读取的变量，
# 有 tests/test_env_template.py 的**双向**门禁把关；需要时直接写进你的 .env 即可）：
#   AVM_IMAGE_TAG              拉取/构建用的镜像 tag，默认 latest（也可填版本如 0.0.1）
#   AVM_HOST_PORT              宿主侧映射端口，默认 8808（容器内固定 8808）
#   AVM_MINTER_ALLOW_INSECURE  铸造服务的安全开关，**默认 1 = 开放**（见文件头）；置 0 恢复 fail-closed
#   AVM_MINTER_BIND_HOST       铸造服务的绑定地址，默认 0.0.0.0；收到回环/内网即"开放但不挂公网"
#   AVM_MINTER_POOL            单个铸造器实例的池子水位，默认 4（≈ 账号额度 × TTL/一轮时长）
#   AVM_MINTER_TTL             铸出的 token 存活上限（秒），默认 120（CF 侧约 300s，按更短算）
#   AVM_MINTER_TZ              铸造容器的时区，**默认 Asia/Shanghai**。E2E-AVM-006 单变量实验
#                              定案的**必要且充分**变量：缺它 ⇒ CF 判定"时区/会话不一致" ⇒
#                              下发交互式挑战（interactive），冷 profile 与热 profile 都铸不出
#                              token。⚠️ **不要删、不要留空** —— 这不是"日志时间好不好看"的项，
#                              而是铸造能否成功的前提（写法的门禁见 tools/compose_wiring_check.py）。
#   AVM_MINTER_RENDER_TIMEOUT_MS       render 常规预算（毫秒），默认 45000
#   AVM_MINTER_COLD_RENDER_TIMEOUT_MS  render **冷启动首轮**预算（毫秒），默认 120000
#                               —— 只是给慢路径留的余量。三轮实测的定性演变（别再倒回去）：
#                                  E2E-AVM-004：冷 profile 首铸**卡死**（120s 也不出），
#                                    旧说法「≈46s 慢成功」是 45s 超时签名的误读，已证伪；
#                                  E2E-AVM-005：加码到 600s 仍不出（确认不是"差一点"，是卡住）；
#                                  E2E-AVM-006：**根因 = 环境缺 TZ**（矩阵见 minter 段注释），
#                                    补上 TZ 后全新冷卷首铸 5.2s、热卷 2.0~3.0s。
#                                  代码侧的 before-interactive-callback 快速失败 + 页面内状态采样
#                                  仍然有用：它把"缺 TZ"这类环境错误从 121s 卡死降到 12s 并给出分类。
# ⚠️ 另有一个**由本文件派生**的注入项（不是用户变量）：`MINTER_ALLOW_INSECURE_RAW`
#    = `${AVM_MINTER_ALLOW_INSECURE:-}`，只喂给 minter-preflight —— 有了它，前置校验才能
#    区分「用户显式设了 ALLOW_INSECURE」与「取 compose 默认值」，归因才如实（报告 AVM12-PF-07）。

services:
  ark-compat:
    image: ghcr.io/jushenzhidao/aivideomaker:${AVM_IMAGE_TAG:-latest}
    build:
      context: .
      args:
        APP_VERSION: ${AVM_IMAGE_TAG:-dev}
    container_name: ark-compat
    restart: unless-stopped

    ports:
      # 容器内固定 8808；这里只管宿主侧端口（用独立变量名，避免与 ARK_PORT 混淆）
      - "${AVM_HOST_PORT:-8808}:8808"
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      # 容器内必须绑 0.0.0.0 —— 绑回环会让端口映射失效
      ARK_HOST: 0.0.0.0
      ARK_PORT: "8808"

      # ---- 上游：只有 web 线（网页端内部接口）----
      # 免费窗口只在这里：tier=turbo 且 duration ≤10s（translate.FREE_MAX_DURATION=10，
      # 2026-09-14 按站点终态记录 `480p/10s/turbo ⇒ paid=False` 更正，原写 8s）。
      AVM_COOKIE: ${AVM_COOKIE:-}
      AVM_BASE_URL: ${AVM_BASE_URL:-https://aivideomaker.ai}
      AVM_VISITOR_ID: ${AVM_VISITOR_ID:-}
      AVM_USER_ID: ${AVM_USER_ID:-}
      # 透传模式：调用方的 Bearer 就是网页会话 cookie，本容器不再需要 AVM_COOKIE。
      # ⚠️ 它与 AVM_GATE_KEY **互斥**：同一个 Authorization: Bearer 不可能既是闸门
      #    密钥又是上游凭据，同设会在 Settings.validate() 处直接拒绝启动。
      AVM_PASSTHROUGH_COOKIE: ${AVM_PASSTHROUGH_COOKIE:-0}

      # ---- 服务自身 ----
      # 网关密钥。**留空 = 不校验**（仅限本机自用）。对外暴露请务必设置，
      # 因为该服务能直接触发计费的上游调用。
      AVM_GATE_KEY: ${AVM_GATE_KEY:-}

      # ---- Turnstile 铸造服务（同 compose 网络的 minter）----
      # 闸门开启且调用方没带 token 时自动取一个；取不到会如实报错（绝不静默提交）。
      # 🔴 默认开启：用 `:-` 插值 ⇒ .env 里**留空与未设同义**，回退到宿主 8899。
      #    要关掉这条能力只有一条路：只起适配层 `docker compose up -d ark-compat`。
      #    （别把这里改回 `-`：那会让模板里的空值把能力**静默关掉**，下方前置校验会为此告警。）
      AVM_MINTER_URL: ${AVM_MINTER_URL:-http://host.docker.internal:8899}
      AVM_MINTER_KEY: ${AVM_MINTER_KEY:-}
      AVM_LOG_LEVEL: ${AVM_LOG_LEVEL:-INFO}

      # ---- 上游闸门与 worker（见 src/gunicorn_conf.py 顶部两条硬约束）----
      # 默认组合 workers=2 + 全局额度 2 ⇒ 每 worker 1、实际全局仍是 2：
      # 拿到了 worker 级故障隔离，又没有超出上游"同时只跑 2 个"的限制。
      # ⚠️ 槽位 = 上游「同时在跑」的额度，**按账号不同**：premium 2 / pro 4
      #    （`ai.queryUserPermission.maxQueueLength`，站点原文同口径）。
      #    设 **0 = 按账号额度自动**（推荐）：写死 2 会让 pro 账号的 4 并发用不满。
      #    加 worker 不会提高吞吐（上游按账号不放行），只会增加故障隔离；
      #    要提吞吐靠"缩短单次占用时间"或"多账号"（账号轮询放在 new-api 那层）。
      AVM_MAX_CONCURRENT: ${AVM_MAX_CONCURRENT:-0}
      AVM_WORKERS: ${AVM_WORKERS:-2}
      AVM_POLL_SECONDS: ${AVM_POLL_SECONDS:-10}
      # 号池上报：余额/闸门 → Logfire 指标（只读）。0=关；多 worker 各报一份。
      AVM_ACCOUNT_REPORT_SECONDS: ${AVM_ACCOUNT_REPORT_SECONDS:-300}
      AVM_QUEUE_MAX_ATTEMPTS: ${AVM_QUEUE_MAX_ATTEMPTS:-8}
      AVM_RETRY_CAPTCHA: ${AVM_RETRY_CAPTCHA:-0}

      # ---- ★ 补透传（2026-09-14 env 比对发现）----
      # 下面这些键**容器内的代码会读**，但 compose 此前从没传过它们 ⇒ 在 .env 里改
      # **完全不生效**（静默无效配置：名字对、门禁过、就是没用）。空串 = 没设：代码侧一律
      # `or 默认值` / `_int(name, default)`，已实测「全空串」与「不设」加载结果逐项相同。
      # gunicorn 侧（src/gunicorn_conf.py；GRACEFUL_TIMEOUT 要与 stop_grace_period 配套改）：
      AVM_GUNICORN_TIMEOUT: ${AVM_GUNICORN_TIMEOUT:-}
      AVM_GUNICORN_GRACEFUL_TIMEOUT: ${AVM_GUNICORN_GRACEFUL_TIMEOUT:-}
      AVM_GUNICORN_KEEPALIVE: ${AVM_GUNICORN_KEEPALIVE:-}
      AVM_GUNICORN_MAX_REQUESTS: ${AVM_GUNICORN_MAX_REQUESTS:-}
      AVM_GUNICORN_MAX_REQUESTS_JITTER: ${AVM_GUNICORN_MAX_REQUESTS_JITTER:-}
      AVM_GUNICORN_BACKLOG: ${AVM_GUNICORN_BACKLOG:-}
      AVM_GUNICORN_WORKER_CONNECTIONS: ${AVM_GUNICORN_WORKER_CONNECTIONS:-}
      AVM_GUNICORN_FORWARDED_IPS: ${AVM_GUNICORN_FORWARDED_IPS:-}
      AVM_GUNICORN_LOGLEVEL: ${AVM_GUNICORN_LOGLEVEL:-}
      AVM_GUNICORN_WATCHDOG_URL: ${AVM_GUNICORN_WATCHDOG_URL:-}
      # 应用侧（src/ark_compat/settings.py）：
      AVM_SERVICE_NAME: ${AVM_SERVICE_NAME:-}
      AVM_ENVIRONMENT: ${AVM_ENVIRONMENT:-}
      AVM_PROBE_TIMEOUT: ${AVM_PROBE_TIMEOUT:-}
      AVM_MINTER_TIMEOUT: ${AVM_MINTER_TIMEOUT:-}
      AVM_ACCOUNT_REPORT_IDENTITY: ${AVM_ACCOUNT_REPORT_IDENTITY:-}

      # ---- 存活看门狗（默认关）----
      # 打开后：连续 N 次本地 /healthz 失败就令 master 退出，交给 restart 策略重建。
      # 这是唯一能覆盖"master 活着但 worker 全僵死"的手段 —— Docker 的 HEALTHCHECK
      # 本身**不会**重启容器。
      AVM_GUNICORN_WATCHDOG: ${AVM_GUNICORN_WATCHDOG:-0}
      AVM_GUNICORN_WATCHDOG_FAILURES: ${AVM_GUNICORN_WATCHDOG_FAILURES:-5}
      AVM_GUNICORN_WATCHDOG_INTERVAL: ${AVM_GUNICORN_WATCHDOG_INTERVAL:-30}

      # ---- 任务持久化 ----
      AVM_TASK_STORE: ${AVM_TASK_STORE:-sqlite}
      AVM_TASK_DB: /data/.ark-tasks.db
      AVM_TASK_RETENTION_DAYS: ${AVM_TASK_RETENTION_DAYS:-7}

      # ---- 可观测性 ----
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      AVM_LOGFIRE_SEND: ${AVM_LOGFIRE_SEND:-if-token-present}
      AVM_DISABLE_LOGFIRE: ${AVM_DISABLE_LOGFIRE:-0}
      AVM_LOGFIRE_CONSOLE: ${AVM_LOGFIRE_CONSOLE:-0}
      AVM_LOGFIRE_SCRUBBING: ${AVM_LOGFIRE_SCRUBBING:-0}
      AVM_LOGFIRE_CAPTURE_HEADERS: ${AVM_LOGFIRE_CAPTURE_HEADERS:-0}
      AVM_LOGFIRE_MAX_CHARS: ${AVM_LOGFIRE_MAX_CHARS:-20000}

      # 容器内没有 macOS scutil 代理，保持关闭
      AVM_NO_TRUST_ENV: ${AVM_NO_TRUST_ENV:-0}

    volumes:
      # 任务表落 SQLite ⇒ 跨容器重建仍能查到正在轮询的任务
      - ark-tasks:/data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8808/healthz', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    # 必须 > gunicorn 的 graceful_timeout（30s），否则容器在 gunicorn 收尾前就 SIGKILL，
    # 在途请求会被硬断。要改 grace 就两处一起改。
    stop_grace_period: 40s

    # 单容器不要开 replicas：上游闸门是**进程内**信号量，副本会把并发放大成
    # 副本数×额度，直接违反上游"同时只跑 2 个"。真要横向扩展必须先换共享闸门实现。
    deploy:
      replicas: 1

  # ------------------------------------------- minter 前置校验（一次性容器）--
  # 目的：把"缺 AVM_MINTER_KEY ⇒ minter 起来就死"从**静默的 restart 循环**变成
  #       **docker compose up 直接失败**。
  #       0.0.7 的破坏性后果正是这条：镜像内 BIND_HOST=0.0.0.0（非回环）＋ 无 key
  #       ⇒ minter 按 fail-closed 退出码 2，而 `up -d` **照样退 0** —— 部署命令看着
  #       成功、服务其实是死的，只有 `docker compose ps` / 日志才看得出来。
  #
  # 为什么不用插值语法 `${AVM_MINTER_KEY:?…}`：这条守卫有**两条**出路（设 key，
  #   或显式 MINTER_ALLOW_INSECURE=1），而 compose 插值表达不了"二选一"。
  # 为什么不在这里重写一遍判据：直接调 **minter 服务启动时用的同一个函数**
  #   （`tools/turnstile_service.py` 的 `bind_guard_error` + `env_flag`）⇒ 判据只有
  #   一处，不会与真实守卫分叉。`BIND_HOST` **故意不设**，继承镜像 ENV（=0.0.0.0），
  #   与真实服务的判据完全一致（若哪天镜像改成回环，这里自动跟着放行）。
  # 两条**按实测校准**的边界：
  #   ① `AVM_IMAGE_TAG` 被钉在 0.0.7 之前（那时还没有 fail-closed 守卫，无 key 也照常服务）
  #      ⇒ 拦它等于拦下一个本来能跑的部署 ⇒ **放行 + 警告**，并提示把 tag 升上去。
  #      （实测踩到：本机 avm-minter:arm64 就是这种老镜像，不加这支会 ImportError 退 1。）
  #   ② 校验自身**导入不了**镜像里的铸造服务代码 ⇒ 那个镜像里的 minter 同样起不来
  #      ⇒ **判失败**：把"校验跑不起来"当成通过，是这类前置检查最典型的自我欺骗。
  # 🔴 **它守不住"服务侧被改"**（2026-09-14 报告 AVM12-PF-08 实测）：这里的 MINTER_KEY 与
  #   ARK_MINTER_KEY 都写成 `${AVM_MINTER_KEY:-}` ⇒ **同源、永远相等**，比的是**自己那份
  #   env**。把 **minter 服务**那一行写死成字面量（`docker compose config` 已确认生效），
  #   本容器照样报 [ok] —— 因为容器里既没有 docker CLI、也看不见别的服务的 env。
  #   ⇒ 真正的接线校验在**宿主机侧**：`python3 tools/compose_wiring_check.py`
  #     （读 compose 解析后的两个服务 env 再比对，`up -d` 之前跑）。这里那条比较保留，
  #     但语义如实降级为「仅防 preflight 自身被改」（P-05 那种改法它确实拦得住）。
  minter-preflight:
    image: ghcr.io/jushenzhidao/aivideomaker-minter:${AVM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.minter
    container_name: avm-minter-preflight
    # 一次性容器：跑完即退。`"no"` 必须加引号（YAML 会把裸 no 当布尔假）
    restart: "no"
    # 默认随 `up -d` 一起跑：铸造能力是**生产默认需要**的（没 token 的提交吞吐只有约
    # 20 条/小时）。不要铸造的人只起适配层（`docker compose up -d ark-compat`）即可绕开。
    # ⚠️ 曾经用过 `profiles: ["minter"]`；但"默认需要铸造"这个前提下，profile 只会让
    #    默认路径**静默少一份能力** —— 那正是本项目最不想要的失败形态，故撤掉。
    # 纯本地判断，不需要（也不该有）网络
    network_mode: none
    environment:
      MINTER_KEY: ${AVM_MINTER_KEY:-}          # = minter 服务读到的值（同源自检，见上）
      ARK_MINTER_KEY: ${AVM_MINTER_KEY:-}      # = ark-compat 读到的值（同源自检，见上）
      # 与 minter 用**同一个表达式**（默认 1 = 开放）⇒ 校验按真实开关判定
      MINTER_ALLOW_INSECURE: ${AVM_MINTER_ALLOW_INSECURE:-1}
      # ★ 上面那个值**分辨不出**"用户显式设了 1"与"compose 默认给的 1"。归因要如实，
      #   就必须知道原始值：留空 = 用户没设过（`${VAR:-}` 的语义，与 template 一致）。
      #   报告 AVM12-PF-07 的根因正是分不清这两者 —— 于是"回环绑定放行"被报成
      #   "显式放行 MINTER_ALLOW_INSECURE"，把人引去查一个根本没设的开关。
      MINTER_ALLOW_INSECURE_RAW: ${AVM_MINTER_ALLOW_INSECURE:-}
      # 也与 minter 同源 ⇒ 按真实绑定地址判定，不再硬套镜像里的 0.0.0.0
      BIND_HOST: ${AVM_MINTER_BIND_HOST:-0.0.0.0}
      # 与 ark-compat 用**完全相同的插值表达式**（注意那个 `:-`）⇒ 校验看到的就是适配层真实
      # 拿到的值；否则会出现"这里读到空、那边拿到兜底"的假告警。
      ARK_MINTER_URL: ${AVM_MINTER_URL:-http://host.docker.internal:8899}
    entrypoint: ["python3", "-c"]
    command:
      - |
        import os
        import sys

        sys.path.insert(0, "/app/tools")

        minter_side = os.environ.get("MINTER_KEY", "")
        ark_side = os.environ.get("ARK_MINTER_KEY", "")
        # ⚠️ 这条比较**只能**看见 preflight 自己这份 env：两侧都写成 `${AVM_MINTER_KEY:-}`
        #    ⇒ **同源、永远相等**。所以它是「preflight 自检」而**不是**「接线校验」——
        #    它拦得住"改 preflight 自己的 env"（P-05 那种），拦不住"把 **minter 服务**那一行
        #    写死成字面量"（P-08：最常见的那种手工接线改法，实测确认被漏过）。
        #    真正的接线校验在**宿主机侧**：`python3 tools/compose_wiring_check.py`。
        if minter_side != ark_side:
            print("[fatal] 接线错误：preflight 自己读到的 MINTER_KEY 与 ARK_MINTER_KEY 不同 "
                  "⇒ 该容器都被改成了不一致的值（取 token 会全部 401）。注意这只能证明"
                  "**本容器**的 env 不一致；服务侧被改的情况要用 "
                  "tools/compose_wiring_check.py 才能发现。", file=sys.stderr)
            sys.exit(2)

        # 判据取自**镜像自己的** /app/tools/turnstile_service.py ⇒ 与 minter 启动时真正
        # 调用的那条判据是同一份代码，不会分叉。
        try:
            import turnstile_service as S
        except Exception as e:  # noqa: BLE001
            # minter 启动时读的是同一份代码 ⇒ 它同样起不来。这里必须**判失败**：
            # 把"校验自身跑不起来"当成通过，是这类前置检查最典型的自我欺骗。
            print("[fatal] 前置校验无法导入镜像内的铸造服务代码（%s: %s）—— 该镜像里的 "
                  "minter 同样起不来，不放行。" % (type(e).__name__, e), file=sys.stderr)
            sys.exit(2)

        if not hasattr(S, "bind_guard_error"):
            # tag 被钉在 0.0.7 之前：那个版本**还没有** fail-closed 守卫（无 key 也照常服务）。
            # 拦它等于拦下一个本来能跑的部署 ⇒ 放行，但把风险与升级建议明确说出来。
            # （实测踩过：本机 avm-minter:arm64 就是这样的老镜像 ⇒ 不加这支会 ImportError 退 1。）
            print("[warn] 该 minter 镜像里没有 bind_guard_error（AVM_IMAGE_TAG 早于 0.0.7？）—— "
                  "跳过错配 key 的校验。⚠️ 这个版本在无 MINTER_KEY 时也会照常服务，请自行确认"
                  "它未暴露在公网；建议把 AVM_IMAGE_TAG 升到 0.0.7+。", file=sys.stderr)
            sys.exit(0)

        bind_host = os.environ.get("BIND_HOST", "127.0.0.1")
        allow_insecure = S.env_flag(os.environ.get("MINTER_ALLOW_INSECURE", ""))
        err = S.bind_guard_error(bind_host, minter_side, allow_insecure)
        if err is None:
            # 归因必须**逐条对得上真实放行原因**（第二版，2026-09-14 报告 AVM12-PF-07）。
            # 第一版按 `if MINTER_KEY … elif allow_insecure … else 回环` **只挑一条**，
            # 而 `MINTER_ALLOW_INSECURE` 在 compose 默认值下恒为 True ⇒ **回环那条分支永远
            # 轮不到**：回环绑定放行被报成"显式放行 MINTER_ALLOW_INSECURE"，运维于是被引去
            # 查一个根本没设的开关。两处修正：
            #   ① 列出**所有**成立的充分理由，而不是挑一条；
            #   ② 借 MINTER_ALLOW_INSECURE_RAW 区分"显式设置"与"取默认值" —— compose 默认
            #      给的 1 与别人显式打开的 1，在运维眼里是两件完全不同的事。
            reasons = []
            if minter_side.strip():
                reasons.append("MINTER_KEY 已设")
            if bind_host.strip() in getattr(S, "LOOPBACK_HOSTS", frozenset()):
                reasons.append("BIND_HOST=%r 是回环绑定（无 key 也放行）" % bind_host)
            raw_insecure = os.environ.get("MINTER_ALLOW_INSECURE_RAW")
            if allow_insecure and raw_insecure is None:
                reasons.append("MINTER_ALLOW_INSECURE=1（**分不清**是显式设置还是默认值 —— "
                               "compose 里缺 MINTER_ALLOW_INSECURE_RAW 插值）")
            elif allow_insecure and str(raw_insecure).strip():
                reasons.append("显式设了 MINTER_ALLOW_INSECURE=1")
            if not reasons:
                reasons.append("MINTER_ALLOW_INSECURE 取 compose 默认值 1（这是开放模式的**默认**，"
                               "不是谁显式打开的）")
            ark_url = os.environ.get("ARK_MINTER_URL", "")
            if not ark_url.strip():
                # 契约护栏：**铸造能力默认开启**靠的是文件头那条带冒号的默认值写法（.env 留空
                # 也回退）。这里读到空值 ⇒ 插值被改回了不带冒号的形式，于是模板里的空值把能力
                # **静默关掉**：容器都在跑、key 也配了，适配层却根本不去取 token。
                print("[warn] 铸造能力被静默关掉了：ark-compat 侧的 AVM_MINTER_URL 为空 ⇒ 适配层"
                      "**不会去取 token**。检查 compose 里该变量的默认值写法是否带冒号"
                      "（留空也回退），或直接在 .env 里填 "
                      "AVM_MINTER_URL=http://host.docker.internal:8899。", file=sys.stderr)
            if allow_insecure and not minter_side.strip():
                # 默认开放是本项目**唯一**的 fail-open 处：不拦，但每次部署都要把它喊出来，
                # 免得"服务在跑"被当成"服务是安全的"。
                # 只在**非回环**绑定下喊：回环绑定时外部根本连不上，跟着喊只会让人对告警脱敏。
                # 判据复用 minter 自己那份回环名单（`LOOPBACK_HOSTS`），不另写一套。
                if bind_host.strip() not in getattr(S, "LOOPBACK_HOSTS", frozenset()):
                    print("[warn] 铸造服务以**开放模式**运行（未设 MINTER_KEY，绑定 %s）—— 任何能连上"
                          "该地址的人都能领 Turnstile token（等于分发过闸能力，也会让账号更快撞"
                          "风控）。收口二选一：① AVM_MINTER_BIND_HOST 收到回环/内网；"
                          "② 设 MINTER_KEY 且把 AVM_MINTER_ALLOW_INSECURE 置 0。" % bind_host,
                          file=sys.stderr)
            print("[ok] minter 前置校验通过（%s）" % "；".join(reasons))
            sys.exit(0)

        print("[fatal] 前置校验未通过：minter 启动时会被自己的失败关闭守卫拒绝（退出码 2），"
              "容器随后进入 restart 循环（`docker compose up -d` 仍会退 0，看着像成功）。\n"
              + err + "\n"
              "  compose 里的两条出路（写进同目录 .env 后重跑 docker compose up -d）：\n"
              "    AVM_MINTER_KEY=<随机串>      # 同一变量同时喂给 ark-compat（取 token）与 minter\n"
              "    AVM_MINTER_ALLOW_INSECURE=1  # 仅私有网络 / 已有外层 ACL 时显式自担风险",
              file=sys.stderr)
        sys.exit(2)

  # ---------------------------------------------------------------- minter --
  # Turnstile token 铸造服务：常驻 Xvfb 有头 Chrome + 令牌池。
  # **不映射端口**：它能产出"绕过风控的凭证"，只给同网络内的 ark-compat 用。
  minter:
    image: ghcr.io/jushenzhidao/aivideomaker-minter:${AVM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.minter
    container_name: avm-minter
    restart: unless-stopped
    # 默认随 `up -d` 起：铸造能力是生产默认需要的（见文件头）。它产出"过闸凭证"且走 host
    # 网络（8899 直达宿主网络栈）⇒ 暴露面靠 `AVM_MINTER_KEY` 收口，并由前置校验挡住缺 key。
    # 缺 key 时由前置校验**挡在前面**：宁可 compose 直接报错，也不要"up 成功 + 循环重启"
    depends_on:
      minter-preflight:
        condition: service_completed_successfully
    # ★ 必须用 **host 网络**：默认 bridge + NAT 会改写 TCP MSS/网络指纹 ⇒ CF 判定为机器人：
    #   `turnstile.render()` 全部吃满 45s 预算超时、0 成功（同机同 Chrome：宿主 3.7s ✅ / bridge 容器 ❌；实测）。
    #   用 host 后容器内实测 2.3~3.5s/个，与宿主同量级。
    # ⚠️ 该修复**只在 Linux 原生 Docker 上成立**：macOS 的 Docker Desktop 里 host 网络
    #   实际是「VM 内 host」，流量仍经 VPNkit NAT 出去 —— 实测（arm64 原生 chromium +
    #   --network host）0/2、46s 超时，与 bridge 同症状 ⇒ **Mac 上 minter 请宿主直跑**
    #   （macOS 有头直跑已验证 2.4~3.5s/个），AVM_MINTER_URL 指宿主地址并停用本服务。
    network_mode: host
    # （host 网络下没有端口映射，`expose` 是死配置，已删——服务直接监听宿主 8899）
    environment:
      PORT: "8899"
      # ★ TZ —— **铸造能否成功的前提，不是可选项**（E2E-AVM-006 单变量实验定案）：
      #   同一台机器、同账号、同 sitekey、同 Chrome，一次只动一个变量：
      #     0.0.14 无 TZ + 冷卷   ⇒ interactive ×5（每次 12s 快速失败，0 token）
      #     0.0.14 无 TZ + 热卷   ⇒ interactive ×3（播种热 profile **不是**解药，AVM16-SEED-HOT）
      #     0.0.14 有 TZ + 热卷   ⇒ minted=4，首铸 2.96s
      #     0.0.14 有 TZ + 全新冷卷 ⇒ minted=4，首铸 5.20s
      #   ⇒ TZ 是必要且充分变量；核心版本 / Chrome 版本 / profile 冷热都不是决定因素。
      #   机制：容器默认 UTC，而 CF 会比对时区与会话的一致性 —— 不一致即升级为交互式挑战。
      # ⚠️ 历史别误读（2026-09-14 那次 TZ 改动被还原，与本条**不矛盾**）：那次的四格实验是在
      #   **macOS 的 Docker Desktop** 上做的，Mac 的 host 网络仍经 VPNkit NAT，四格全挂 ⇒
      #   当时判"TZ 不是因子"是对的（Mac 上本来就是宿主机直跑 minter）。本条的结论来自
      #   **node064（Linux 原生 Docker + host 网络）**的干净单变量实验，两者不在同一前提上。
      # 留空 = 回落 Asia/Shanghai（`:-` 插值）：缺这个默认值会让时区静默变成 UTC，
      # 而服务照常启动、/healthz 照常 ready —— 正是本项目最不想要的失败形态。
      TZ: ${AVM_MINTER_TZ:-Asia/Shanghai}
      # 🔓 **默认开放**（2026-09-14 用户口径：默认参数就能跑，不新增必填项）：不配 key
      #    直接跑，故 MINTER_ALLOW_INSECURE 默认 1 —— 这是本文件**唯一**的 fail-open 处
      #    （服务启动时那句 fail-closed 守卫就被这一位放行）。
      #    代价见文件头：host 网络下 8899 即宿主端口，无凭据 = 谁连得上谁就能领 token。
      MINTER_KEY: ${AVM_MINTER_KEY:-}
      # 默认 1 = 开放（见上）。要恢复 fail-closed：置 0 并配 MINTER_KEY。
      MINTER_ALLOW_INSECURE: ${AVM_MINTER_ALLOW_INSECURE:-1}
      # 绑定地址，默认与镜像一致（0.0.0.0 = 开箱即用）。"开放但不挂公网"就收到回环/内网地址，
      # 例如 AVM_MINTER_BIND_HOST=172.17.0.1（docker0 网关，桥接网络里的 ark-compat 可达）。
      BIND_HOST: ${AVM_MINTER_BIND_HOST:-0.0.0.0}
      # 池子水位与 token 存活上限（秒）。
      # ⚠️ POOL_TARGET 是**每个铸造器实例**的池子，不是账号维度（token 绑 sitekey+域名，
      #    不绑账号 ⇒ 一个铸造器可服务所有账号）。
      # 定法：POOL_TARGET ≈ 该账号的 maxQueueLength × (TTL / 一轮任务时长)。
      #   单号 pro（4 并发、任务 ~2 分钟、TTL 120s）⇒ 4 正好；premium ⇒ 2。
      # **开大没好处** —— 没被用掉的 token 会自然老死。
      POOL_TARGET: ${AVM_MINTER_POOL:-4}
      TOKEN_TTL_S: ${AVM_MINTER_TTL:-120}
      # render 预算（毫秒）。**为什么要有两条**：常规 45s 预算下，冷 profile 的首次铸造
      # 在新部署上从未成功过（现象 `POST /v1/turnstile/mint` 503 + TIMEOUT，而
      # `/healthz` 早在 10 秒时就报了 `ready=true` —— 看起来像"镜像坏了"）。
      # ⚠️ E2E-AVM-004 复盘：这**不是**「冷启动 ≈46s 慢成功」（旧说法已证伪 —— 120s 冷
      # 预算同样两次精确压线失败，是卡死不是慢）；E2E-AVM-006 之后已定案：**根因是环境缺
      # TZ**（见上面的 `TZ` 项），超时预算怎么加都治不了（600s 也测过）。COLD 预算与
      # INTERACTIVE 快速失败（进 /healthz 的 last_failure）现在的价值是**归因**：
      # 12s 就给出分类与页面状态，而不是让人对着 121s 猜。
      # 首轮走 COLD，铸出过 token 之后回落到常规值。
      MINT_TIMEOUT_MS: ${AVM_MINTER_RENDER_TIMEOUT_MS:-45000}
      COLD_MINT_TIMEOUT_MS: ${AVM_MINTER_COLD_RENDER_TIMEOUT_MS:-120000}
    volumes:
      - minter-chrome:/data
    # Chrome 吃 /dev/shm；给大一点比依赖 --disable-dev-shm-usage 更稳
    shm_size: "512m"
volumes:
  ark-tasks:

  minter-chrome:
