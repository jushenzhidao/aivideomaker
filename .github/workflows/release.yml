name: Release

# push 到 main 即发版：自增 patch → 打 tag → 建 Release → 推 GHCR 镜像（linux/amd64）。
# 版本号只存 tag，不写回任何 manifest 文件 —— 写回需要向主干提交，而 GITHUB_TOKEN
# 推送的提交不会触发任何 workflow，会静默破坏依赖该提交的流水线。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 建 tag / Release
  packages: write   # 推 ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # 并发会争抢版本号与 tag，必须串行

jobs:
  # ---------------------------------------------------------------- hygiene --
  # 全量单测 + 零外发审计 + 零跳过。`tools/egress_audit.py` 一次跑完三件事：
  #   跑完 discover 全部用例，拦下所有**非回环** TCP 连接并打印调用栈，再断言**没有用例被跳过**
  #   —— 任一条不满足都以非 0 退出。这里是 CI 里**唯一**的测试门禁（此前流水线根本不跑单测）。
  #   第三条是 2026-09-14 补的：`skipped` 与"通过"在报告里长得一模一样（只多一句
  #   `OK (skipped=1)`），实测就有一条编排门禁因此**在流水线里从不执行**。
  #
  # 三条设计取舍，都是被真实故障逼出来的：
  #  1. 放在 release **之前**、并让 release `needs` 它 ⇒ 门禁红时**连 tag 都不创建**，
  #     不会"先烧掉一个版本号，再发现树是坏的"（tag 一旦打出就很难收回）。
  #  2. **刻意不跟随跳过标记**：那条标记的语义是"这次不发版"，而"测试每推必跑"才是它的价值。
  #     实测教训（2026-09-14）：提交信息里只是**提到**该标记，整条流水线就被 skip 成 1 秒
  #     —— 若测试也绑在同一条件下，就等于"写文档的那次提交可以完全不验证"；
  #     而**恰恰是文档提交最容易弄坏口径类门禁**（例如把 README 的免费窗口写回 8s）。
  #  3. 必须钉 **Python 3.12**：`translate.py` 用了 PEP 701（f-string 嵌套引号），
  #     3.11 及以下直接 SyntaxError —— 本地已踩过，别误判为代码回归。
  #
  # 为什么要 setup-python 而不是用 runner 自带的 python：runner 的默认版本随镜像漂移，
  # 而本项目对版本有硬要求（见上）。显式钉死才能让"本地绿 / CI 红"的差异收敛到代码本身。
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 🔴 `requirements-dev.txt` 不能省 —— 三个测试期依赖（见该文件的成因说明）。
      #    丢掉真实代价的实测（2026-09-14，在干净 venv 里复刻本作业时才发现）：
      #      · 缺 websocket-client ⇒ `import websocket` 直接 ModuleNotFoundError；
      #      · 缺 pytest ⇒ `Ran 269 tests / 2 ERROR`：`logfire.testing` 自己 import 它，
      #        报错发生在**收集阶段**，`test_trace_contract` / `test_pool_metrics`
      #        整个模块不被收集（本项目共 313 项，少 44 项正对应这两个模块）；
      #      · 缺 pyyaml ⇒ 编排门禁的**第二条解析路**整条 skip（报告 AVM12-OPEN-PYYAML）：
      #        "两条路互相校验"实际只剩一条，而输出只是 `OK (skipped=1)`，毫无提示。
      #    三个坑**本地都复现不出来**（开发环境恰好装着），只有干净环境才现形。
      #    ⇒ 现在 `tools/egress_audit.py` 会断言 `skipped == 0`，让这类缺失**当场变红**。
      - name: Install deps
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q \
            -r requirements.txt -r requirements-dev.txt

      - name: 全量单测 + 零外发审计 + 零跳过
        run: python3 tools/egress_audit.py

      # 编排接线校验（纯静态，**不需要 docker**）。
      # 为什么必须在 CI 里跑：容器里的 `minter-preflight` 只能看见**自己那份 env**
      # （两侧同源于 AVM_MINTER_KEY ⇒ 永远相等），于是"把某个服务那行写死成字面量"
      # 这种最常见的手工接线改法它看不见（报告 AVM12-PF-08）。
      - name: compose 接线校验
        run: python3 tools/compose_wiring_check.py

  release:
    # 逃生阀：提交信息里带跳过标记就不发版。
    # ⚠️ 这个字面量不得出现在任何"需要发版"的提交信息里 —— 它匹配整条 message，
    #    连"给逃生阀写说明"的那次提交自己也会命中，job 直接 skipped。
    #    中招时用 workflow_dispatch 补跑（该路径 head_commit 为 null，已用 || '' 兜底）。
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[skip release]') }}
    # 测试门禁（hygiene）没绿就不发版 —— 连 tag 都不会创建
    needs: [hygiene]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.next }}
      version_bare: ${{ steps.ver.outputs.next_bare }}
      prev: ${{ steps.ver.outputs.prev }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 浅克隆拿不到历史 tag ⇒ 版本号永远从 v0.0.1 起算

      - name: Resolve next version
        id: ver
        run: |
          set -euo pipefail
          # --sort=-v:refname：字典序会把 v1.9.0 判为新于 v1.10.0
          # glob 限定三段纯数字，顺带把 latest 这类滚动指针排除在外
          PREV=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
          BASE="${PREV:-v0.0.0}"
          CORE="${BASE#v}"
          IFS=. read -r MA MI PA <<< "$CORE"
          PA="${PA%%[-+]*}"          # 预发布后缀（v1.2.3-rc.1）会让 $(( )) 报错
          NEXT="v${MA}.${MI}.$((PA + 1))"
          {
            echo "prev=${PREV}"
            echo "next=${NEXT}"
            echo "next_bare=${NEXT#v}"
          } >> "$GITHUB_OUTPUT"
          echo "prev=${PREV:-<none>} -> next=${NEXT}"

      - name: Build changelog
        id: log
        run: |
          set -euo pipefail
          PREV='${{ steps.ver.outputs.prev }}'
          if [ -z "$PREV" ]; then RANGE=HEAD; else RANGE="${PREV}..HEAD"; fi
          {
            echo 'body<<CHANGELOG_EOF'
            echo '## Changes'
            # --max-count：首个 release 时 RANGE=HEAD 会走完整历史，长仓正文会很大
            git log "$RANGE" --max-count=50 --pretty='- %s (%h)' --no-merges || echo '- Initial release'
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a '${{ steps.ver.outputs.next }}' -m 'Release ${{ steps.ver.outputs.next }}'
          git push origin '${{ steps.ver.outputs.next }}'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 经 env 传值而不是内联到 shell：提交信息里出现单引号会把
          # `--notes '...'` 撕开，导致 release 建不出来或正文被截断。
          BODY: ${{ steps.log.outputs.body }}
          TAG: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          printf '%s\n' "$BODY" > /tmp/notes.md
          # 本仓是直推 main、没有合并 PR ⇒ --generate-notes 只会产出一行 compare 链接，
          # 所以 changelog 由上面的 git log 自己生成后经 --notes-file 传入。
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes-file /tmp/notes.md

  image:
    needs: release
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}   # 构建的必须是刚打的那个 tag

      - name: Build and push (linux/amd64)
        id: build
        env:
          VERSION: ${{ needs.release.outputs.version_bare }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"                 # GHCR 要求仓库路径全小写
          echo "image=${IMAGE}  version=${VERSION}"

          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          # 一次 build 出三个 tag。git tag 带 v 前缀，镜像 tag 不带（组织惯例）。
          docker build \
            --build-arg APP_VERSION="${VERSION}" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:sha-$(git rev-parse --short=7 HEAD)" \
            .

          # digest 只从 push 输出里读。
          # ⚠️ 不要用 `docker inspect --format '{{.RepoDigests}}'` 比较三个 tag ——
          #    RepoDigests 是「仓库级」而非「tag 级」，三个 tag 会读到同一个值，
          #    那样的门禁恒真、永远拦不住任何东西。
          : > /tmp/digests.txt
          for T in "${VERSION}" latest "sha-$(git rev-parse --short=7 HEAD)"; do
            OUT="$(docker push "${IMAGE}:${T}" 2>&1)"
            printf '%s\n' "$OUT" | tail -n 3
            D="$(printf '%s' "$OUT" \
                 | sed -n 's/.*digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' | tail -n1)"
            [ -n "$D" ] || { echo "::error::没能从 push 输出里解析出 ${T} 的 digest"; exit 1; }
            printf '%s -> %s\n' "$T" "$D"
            printf '%s=%s\n' "$T" "$D" >> /tmp/digests.txt
          done

          UNIQ="$(cut -d= -f2 /tmp/digests.txt | sort -u | wc -l | tr -d ' ')"
          cat /tmp/digests.txt
          if [ "${UNIQ}" -ne 1 ]; then
            echo "::error::三个 tag 的 manifest digest 不一致（${UNIQ} 种）—— 不是同一次 build"
            exit 1
          fi
          DIGEST="$(cut -d= -f2 /tmp/digests.txt | head -n1)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

          # 去掉本地 tag，让下面的冒烟测试必须真的回 registry 取
          for T in "${VERSION}" latest "sha-$(git rev-parse --short=7 HEAD)"; do
            docker image rm "${IMAGE}:${T}" >/dev/null 2>&1 || true
          done

      - name: Smoke test the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          # 按 digest 测，测的是"推上去的那个产物"，不是本地刚 build 的镜像
          docker pull "${IMAGE}@${DIGEST}"

          CID="$(docker run -d -p 8808:8808 \
            -e AVM_DISABLE_LOGFIRE=1 \
            -e AVM_TASK_STORE=memory \
            -e AVM_AUTH=passthrough \
            "${IMAGE}@${DIGEST}")"
          trap 'docker logs "${CID}" 2>&1 | tail -n 30 || true; docker rm -f "${CID}" >/dev/null 2>&1 || true' EXIT

          OK=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8808/healthz -o /tmp/healthz.json; then OK=1; break; fi
            sleep 1
          done
          if [ "$OK" -ne 1 ]; then
            echo "::error::容器 30s 内没有对外提供 /healthz"
            exit 1
          fi

          cat /tmp/healthz.json
          # AVM_DISABLE_LOGFIRE=1 / AVM_TASK_STORE=memory 保证冒烟测试零外发、不落 DB 文件。
          # AVM_AUTH=passthrough 是**必需**的：settings.validate() 在启动期就要求
          # 「AVM_COOKIE 或透传模式」二者之一，缺失则 worker 直接退出码 3、master 关闭，
          # /healthz 永远起不来（2026-09-14 实测：报 "至少要配一份凭据"）。
          # 选透传而不是塞一份真 cookie：它不需要任何真实凭据即可通过校验，且不落任何密文。
          # ⚠️ 鉴权自 0.0.20 起是**一个变量**（AVM_AUTH 三选一）—— 旧的
          #    AVM_PASSTHROUGH_COOKIE / AVM_GATE_KEY 若"还有行为"会让启动被拒，别再写回去。
          python3 -c "import json;d=json.load(open('/tmp/healthz.json'));assert d.get('ok') is True, d;print('healthz ok |', d.get('service'), '| task_store =', d.get('task_store'))"

  # minter 镜像（Turnstile 铸造服务：Chrome + Xvfb，约 1.6GB）。
  # 与主镜像同 tag 规则、同 digest 门禁。**必须与 image job 并行**——两者都只依赖 release，
  # 串行会白白多等一次全量 Chrome 装机（~5 分钟）。
  minter-image:
    needs: release
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}-minter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}   # 与主镜像同一 tag，绝不漂移

      - name: Build and push (linux/amd64)
        id: build
        env:
          VERSION: ${{ needs.release.outputs.version_bare }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"                 # GHCR 要求仓库路径全小写
          echo "image=${IMAGE}  version=${VERSION}"

          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          docker build \
            -f Dockerfile.minter \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:sha-$(git rev-parse --short=7 HEAD)" \
            .

          # 同主镜像的门禁：三 tag 必须出自同一次 build（digest 唯一）
          : > /tmp/digests.txt
          for T in "${VERSION}" latest "sha-$(git rev-parse --short=7 HEAD)"; do
            OUT="$(docker push "${IMAGE}:${T}" 2>&1)"
            printf '%s\n' "$OUT" | tail -n 3
            D="$(printf '%s' "$OUT" \
                 | sed -n 's/.*digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' | tail -n1)"
            [ -n "$D" ] || { echo "::error::没能从 push 输出里解析出 ${T} 的 digest"; exit 1; }
            printf '%s -> %s\n' "$T" "$D"
            printf '%s=%s\n' "$T" "$D" >> /tmp/digests.txt
          done
          UNIQ="$(cut -d= -f2 /tmp/digests.txt | sort -u | wc -l | tr -d ' ')"
          if [ "${UNIQ}" -ne 1 ]; then
            echo "::error::三个 tag 的 manifest digest 不一致（${UNIQ} 种）—— 不是同一次 build"
            exit 1
          fi
          DIGEST="$(cut -d= -f2 /tmp/digests.txt | head -n1)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

          for T in "${VERSION}" latest "sha-$(git rev-parse --short=7 HEAD)"; do
            docker image rm "${IMAGE}:${T}" >/dev/null 2>&1 || true
          done

      # 冒烟：只验证「HTTP 服务起来 + Chrome 被拉起」，**不要求 ready=true**——
      # ready 取决于 CF 放行 runner 的出口 IP，那是风控问题不是镜像问题，拿它当门禁会误红。
      # host 网络是部署契约（bridge + NAT 会让 render 46s 超时），冒烟也按契约跑。
      #
      # 🔴 必须带 MINTER_KEY：镜像里 BIND_HOST=0.0.0.0，而服务是 **fail-closed**
      #    （非回环绑定 + 无 key ⇒ 拒绝启动，退出码 2）。2026-09-14 这次冒烟正是因此变红 ——
      #    那是"守卫按设计生效"，不是镜像坏。所以冒烟按**生产形态**跑（带 key），
      #    并额外做两次反向断言，把安全契约钉进 CI。
      - name: Smoke test the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          docker pull "${IMAGE}@${DIGEST}"

          # ---- 反向断言 ①：非回环绑定 + 无 MINTER_KEY ⇒ 必须拒绝启动 ----
          # 契约依据：本服务产出的 token 能直接过掉上游提交闸门，暴露即等于免费分发。
          set +e
          NOKEY_OUT="$(timeout 90 docker run --rm --network host "${IMAGE}@${DIGEST}" 2>&1)"
          NOKEY_RC=$?
          set -e
          if [ "${NOKEY_RC}" -eq 0 ]; then
            echo "::error::未设 MINTER_KEY 却启动成功了 —— fail-closed 契约被破坏"
            exit 1
          fi
          if ! grep -q "拒绝启动" <<<"${NOKEY_OUT}"; then
            echo "::error::容器没起来，但原因不是绑定守卫（退出码 ${NOKEY_RC}）。日志尾部："
            tail -n 20 <<<"${NOKEY_OUT}"
            exit 1
          fi
          echo "ok：无 key + 非回环 ⇒ 按契约拒绝启动（退出码 ${NOKEY_RC}）"

          # ---- 正向冒烟：带上 key，按生产形态起 ----
          CID="$(docker run -d --network host -e MINTER_KEY=smoke-only "${IMAGE}@${DIGEST}")"
          trap 'docker logs "${CID}" 2>&1 | tail -n 20 || true; docker rm -f "${CID}" >/dev/null 2>&1 || true' EXIT

          BROWSER=""
          for _ in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:8899/healthz -o /tmp/minter.json 2>/dev/null; then
              BROWSER="$(python3 -c "import json;print(json.load(open('/tmp/minter.json')).get('browser') or '')" 2>/dev/null || true)"
              [ -n "$BROWSER" ] && break
            fi
            sleep 2
          done
          if [ -z "$BROWSER" ]; then
            echo "::error::45s 内铸造服务的 HTTP 没起来或 Chrome 没被拉起"
            exit 1
          fi
          cat /tmp/minter.json

          # ---- 反向断言 ②：服务起来了，但**没有凭据的铸造请求必须被拒**（401）----
          # 放在 healthz 之后：此刻服务已监听，401 只可能来自鉴权而不是"没起来"。
          CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
            -X POST http://127.0.0.1:8899/v1/turnstile/mint || true)"
          if [ "${CODE}" != "401" ]; then
            echo "::error::未带 X-Minter-Key 的铸造请求返回 ${CODE}，应为 401（鉴权没接线）"
            exit 1
          fi
          echo "ok：无凭据的铸造请求被拒（401）"
          echo "minter 冒烟通过：HTTP 200，Chrome = ${BROWSER}"
